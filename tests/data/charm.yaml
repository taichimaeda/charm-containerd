description: Overlay for attaching current charm
applications:
  calico:
    # NOTE: Used to be edge but it ships incompatible Python version on Noble.
    channel: stable
  containerd:
    charm: {{charm}}
    channel: null
    options:
      disable-juju-proxy: "true"
  docker-registry:
    charm: docker-registry
    channel: edge
    num_units: 1
  # NOTE: Test registry for the custom_registries config path.
  custom-registry:
    charm: docker-registry
    channel: edge
    num_units: 1
  ##  TEMPORARY FIX FOR PASSING INTEGRATION TESTS
  kubernetes-control-plane:
    options:
      enable-metrics: false
  ################################################
relations:
- - docker-registry:docker-registry
  - containerd:docker-registry
# NOTE:
# custom-registry does not declare relation intentionally.
# docker-registry supplies credentials via relation, but
# custom-registry uses the custom_registries config option for this purpose.
- - docker-registry:cert-provider
  - easyrsa:client
- - custom-registry:cert-provider
  - easyrsa:client
